// Invisible prop: sets the intensity of the cabin light "light1" of the Tantares
// IVA model (MAS INT_LIGHT); off without power or when the "TIE_CabinLight"
// persistent (cabin light switch, on by default) is 0.
PROP
{
	name = TIE_CabinLight

	MODEL
	{
		model = TantaresIVAExpansion/props/TIE_CabinLight/model
	}

	MODULE
	{
		name = MASComponent
		startupScript = fc.InitializePersistent("TIE_CabinLight", 1)

		INT_LIGHT
		{
			name = Cabin light
			lightName = light1
			intensity = 3
			variable = fc.Conditioned(fc.GetPersistentAsNumber("TIE_CabinLight"))
		}
	}
}
