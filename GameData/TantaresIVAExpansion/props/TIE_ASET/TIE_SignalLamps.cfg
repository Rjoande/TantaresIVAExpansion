			name = Power on
			transform = LampObj
			startScale = -1,-1,-1
			endScale = 0,0,0
			variable = fc.Conditioned(1)
		}
		TEXT_LABEL
		{
			name = Name
			transform = TopTextObj
			fontSize = 1.5
			lineSpacing = 0.9
			font = Liberation Sans
			style = Bold
			alignment = Center
			anchor = LowerCenter
