PROP
{
	name = TIE_Lamp_SAS

	MODEL
	{
		model = ASET/ASET_Props/Instruments/ASET_SignalLamp/ASET_SignalLamp
	}

	MODULE
	{
		name = MASComponent
		COLOR_SHIFT
		{
			name = Lamp
			transform = LampObj
			passiveColor = 0,30,0,255
			activeColor = 0,255,0,255
			variable = fc.Conditioned(fc.GetSAS())
