// Battery voltmeter: stock radar altimeter with the RB-SOC dial face from RealBattery.
// Shows a silver-zinc cell, 1.3 V empty to 1.85 V full; 0 V without power. The dial is
// not linear: degrees from the printed marks (0.5 V steps up to 2.5 V at 180 degrees).
PROP
{
	name = TIE_Voltmeter

	MODEL
	{
		model = Squad/Props/radarAltitude/model
		texture = model000, TantaresIVAExpansion/props/TIE_Voltmeter/voltmeter
	}

	MODULE
	{
		name = MASComponent

		ROTATION
		{
			name = Needle
			transform = indicator
			startRotation = 0,0,0
			endRotation = 0,0,-250
			range = 0, 250
			blend = true
			speed = 1.0
			// 1.0-1.5 V: 70-110 degrees; 1.5-2.0 V: 110-145 degrees
			variable = fc.Conditioned(fc.Select(fc.PowerPercent() < 0.3636, 70 + (0.3 + 0.55 * fc.PowerPercent()) * 80, 110 + (0.55 * fc.PowerPercent() - 0.2) * 70))
		}
	}
}
