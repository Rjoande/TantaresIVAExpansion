// IVA switches (Reviva): the original Tantares IVA stays the default and first subtype,
// ours follow. internalName of ModuleIVASwitch is the IVA used before any switch.
@PART[tantares_v2_crew_s1_1]:HAS[!MODULE[ModuleIVASwitch]]
{
	MODULE
	{
		name = ModuleIVASwitch
		internalName = tantares_crew_s1_1_interior
	}

	MODULE
	{
		name = ModuleB9PartSwitch
		moduleID = IVASwitch
		switcherDescription = IVA
		switcherDescriptionPlural = #LOC_TIE_IVAs
		switchInFlight = true
		uiGroupName = IVASwitch
		uiGroupDisplayName = #LOC_TIE_IVA_Switch

		SUBTYPE
		{
			name = Tantares
			primaryColor = White
			secondaryColor = White
			descriptionSummary = #LOC_TIE_Tantares_Summary
			descriptionDetail = #LOC_TIE_Tantares_Detail

			MODULE
			{
				IDENTIFIER
				{
					name = ModuleIVASwitch
				}
				DATA
				{
					internalName = tantares_crew_s1_1_interior
				}
			}
		}
		SUBTYPE
		{
			name = analog
			title = Sirius
			primaryColor = Avocado // Avacadonics
			secondaryColor = White
			descriptionSummary = #LOC_TIE_Sirius_Summary
			descriptionDetail = #LOC_TIE_Sirius_Detail

			MODULE
			{
				IDENTIFIER
				{
					name = ModuleIVASwitch
				}
				DATA
				{
					internalName = tantares_crew_s1_1_interior_analog
				}
			}
		}
		SUBTYPE
		{
			name = glass
			title = Neptune
			primaryColor = Cyan
			secondaryColor = White
			descriptionSummary = #LOC_TIE_Neptune_Summary
			descriptionDetail = #LOC_TIE_Neptune_Detail

			MODULE
			{
				IDENTIFIER
				{
					name = ModuleIVASwitch
				}
				DATA
				{
					internalName = tantares_crew_s1_1_interior_glass
				}
			}
		}
	}
}

