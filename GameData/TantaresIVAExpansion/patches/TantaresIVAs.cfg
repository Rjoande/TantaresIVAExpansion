// Flight computer for the MAS props of the capsule IVAs, declared here instead of
// relying on the fallback patches of MAS and Reviva (MAS needs a ModuleCommand).
@PART[tantares_v2_crew_s1_1|virgo_crew_s1_1]:HAS[!MODULE[MASFlightComputer]]
{
	MODULE
	{
		name = MASFlightComputer
		requiresPower = true
		gLimit = 4.7
		baseDisruptionChance = 0.20
	}
}

// Orbital modules (Soyuz, LOK, Progress) and Progress cargo modules: MAS needs a
// ModuleCommand, so they get one that never controls the vessel (crew capacity is 1).
// :FINAL keeps mods that patch command parts away from it.
@PART[tantares_v2_orbital_module_s1_1|tantares_v2_orbital_module_s1_2|tantares_v2_orbital_module_s1_3|virgo_orbital_module_s1_1|hamal_orbital_module_s1_1|hamal_cargo_module_s1p5_1|hamal_cargo_module_s1p5_2]:NEEDS[AvionicsSystems]:HAS[!MODULE[ModuleCommand]]:FINAL
{
	MODULE
	{
		name = ModuleCommand
		minimumCrew = 99
	}
}

@PART[tantares_v2_orbital_module_s1_1|tantares_v2_orbital_module_s1_2|tantares_v2_orbital_module_s1_3|virgo_orbital_module_s1_1|hamal_orbital_module_s1_1|hamal_cargo_module_s1p5_1|hamal_cargo_module_s1p5_2]:NEEDS[AvionicsSystems]:HAS[!MODULE[MASFlightComputer]]:FINAL
{
	MODULE
	{
		name = MASFlightComputer
		requiresPower = true
		gLimit = 4.7
		baseDisruptionChance = 0.20
	}
}

// FreeIVA passes through the old Soyuz parachute container but not the v2 one, which
// sits between capsule and orbital module and blocks the hatch on both sides.
@PART[tantares_v2_parachute_s0_1]:NEEDS[FreeIva]:HAS[!MODULE[ModuleFreeIva]]:AFTER[FreeIva]
{
	MODULE
	{
		name = ModuleFreeIva
		passThroughNodeA = top
		passThroughNodeB = bottom
	}
}

// MAS docking radar (as MAS gives the stock ports): targets the nearest vessel or
// docking port within 250 km, for the radar circuit breaker of the Neptune IVA.
@PART[octans_androgynous_docking_port_s0p5_1|octans_androgynous_docking_port_s0p5_2|octans_basic_docking_port_s0p5_1_female|octans_basic_docking_port_s0p5_1_male|octans_docking_port_s0p5_1_female|octans_docking_port_s0p5_1_male|petra_docking_port_s0p5_1_female|petra_docking_port_s0p5_1_male]:NEEDS[AvionicsSystems]:HAS[!MODULE[MASRadar]]
{
	MODULE
	{
		name = MASRadar
		maxRange = 250
		resourceAmount = 0.6
		targetDockingPorts = true
	}
}

// MAS docking camera (as MAS gives the stock ports), for the DOCK mode of the VZOR.
@PART[octans_androgynous_docking_port_s0p5_1|octans_androgynous_docking_port_s0p5_2|octans_basic_docking_port_s0p5_1_female|octans_basic_docking_port_s0p5_1_male|octans_docking_port_s0p5_1_female|octans_docking_port_s0p5_1_male|petra_docking_port_s0p5_1_female|petra_docking_port_s0p5_1_male]:NEEDS[AvionicsSystems]:HAS[!MODULE[MASCamera]]
{
	MODULE
	{
		name = MASCamera
		cameraName = DockCam
		fovRange = 30, 30
		panRange = 0, 0
		tiltRange = 0, 0
		cameraTransformName = dockingNode
	}
}

// Male ports: the probe sits on the camera axis, so the DockCam moves 1 cm past its tip
// (empty transform with the dockingNode axes: +z out of the port).
@PART[octans_docking_port_s0p5_1_male]:NEEDS[AvionicsSystems]:HAS[@MODULE[MASCamera]:HAS[#cameraName[DockCam],#cameraTransformName[dockingNode]]]
{
	MODEL
	{
		model = TantaresIVAExpansion/models/tie_dockcam
		position = 0, 0.446, 0
		rotation = -90, 0, 0
	}
	@MODULE[MASCamera]:HAS[#cameraName[DockCam]]
	{
		@cameraTransformName = tie_dockcam
	}
}

@PART[octans_basic_docking_port_s0p5_1_male]:NEEDS[AvionicsSystems]:HAS[@MODULE[MASCamera]:HAS[#cameraName[DockCam],#cameraTransformName[dockingNode]]]
{
	MODEL
	{
		model = TantaresIVAExpansion/models/tie_dockcam
		position = 0, 0.863, 0
		rotation = -90, 0, 0
	}
	@MODULE[MASCamera]:HAS[#cameraName[DockCam]]
	{
		@cameraTransformName = tie_dockcam
	}
}

@PART[petra_docking_port_s0p5_1_male]:NEEDS[AvionicsSystems]:HAS[@MODULE[MASCamera]:HAS[#cameraName[DockCam],#cameraTransformName[dockingNode]]]
{
	MODEL
	{
		model = TantaresIVAExpansion/models/tie_dockcam
		position = 0, 0.397, 0
		rotation = -90, 0, 0
	}
	@MODULE[MASCamera]:HAS[#cameraName[DockCam]]
