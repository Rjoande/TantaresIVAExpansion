// Flight computer for the MAS props of the capsule IVAs, declared here instead of
// relying on the fallback patches of MAS and Reviva (MAS needs a ModuleCommand).
@PART[tantares_v2_crew_s1_1|virgo_crew_s1_1]:HAS[!MODULE[MASFlightComputer]]
{
	MODULE
	{
		name = MASFlightComputer
		requiresPower = true
		gLimit = 4.7
		baseDisruptionChance = 0.20
	}
}

// Orbital modules: MAS needs a ModuleCommand, so they get one that never controls the
// vessel (crew capacity is 1). :FINAL keeps mods that patch command parts away from it.
@PART[tantares_v2_orbital_module_s1_1|tantares_v2_orbital_module_s1_2|tantares_v2_orbital_module_s1_3|virgo_orbital_module_s1_1]:NEEDS[AvionicsSystems]:HAS[!MODULE[ModuleCommand]]:FINAL
{
	MODULE
	{
		name = ModuleCommand
		minimumCrew = 99
	}
}

@PART[tantares_v2_orbital_module_s1_1|tantares_v2_orbital_module_s1_2|tantares_v2_orbital_module_s1_3|virgo_orbital_module_s1_1]:NEEDS[AvionicsSystems]:HAS[!MODULE[MASFlightComputer]]:FINAL
{
	MODULE
	{
		name = MASFlightComputer
		requiresPower = true
		gLimit = 4.7
		baseDisruptionChance = 0.20
	}
}

// MAS docking radar (as MAS gives the stock ports): targets the nearest vessel or
// docking port within 250 km, for the radar circuit breaker of the Neptune IVA.
@PART[octans_androgynous_docking_port_s0p5_1|octans_androgynous_docking_port_s0p5_2|octans_basic_docking_port_s0p5_1_female|octans_basic_docking_port_s0p5_1_male|octans_docking_port_s0p5_1_female|octans_docking_port_s0p5_1_male|petra_docking_port_s0p5_1_female|petra_docking_port_s0p5_1_male]:NEEDS[AvionicsSystems]:HAS[!MODULE[MASRadar]]
{
	MODULE
	{
		name = MASRadar
		maxRange = 250
		resourceAmount = 0.6
		targetDockingPorts = true
	}
}

// MAS docking camera (as MAS gives the stock ports), for the DOCK mode of the VZOR.
@PART[octans_androgynous_docking_port_s0p5_1|octans_androgynous_docking_port_s0p5_2|octans_basic_docking_port_s0p5_1_female|octans_basic_docking_port_s0p5_1_male|octans_docking_port_s0p5_1_female|octans_docking_port_s0p5_1_male|petra_docking_port_s0p5_1_female|petra_docking_port_s0p5_1_male]:NEEDS[AvionicsSystems]:HAS[!MODULE[MASCamera]]
{
	MODULE
	{
		name = MASCamera
		cameraName = DockCam
		fovRange = 30, 30
		panRange = 0, 0
		tiltRange = 0, 0
		cameraTransformName = dockingNode
	}
}

// VZOR cameras on the Tantares Soyuz periscope: forward along the hull (central field)
// and outwards (nadir field); cameraTransform looks along +y of the part.
@PART[octans_periscope_srf_1]:NEEDS[AvionicsSystems]:HAS[!MODULE[MASCamera]]
{
	MODULE
	{
		name = MASCamera
		cameraName = TIE_VZOR_Fwd
		fovRange = 40, 40
		panRange = 0, 0
		tiltRange = 0, 0
		cameraTransformName = cameraTransform
	}
	MODULE
	{
		name = MASCamera
		cameraName = TIE_VZOR_Nadir
		fovRange = 120, 120
		panRange = 0, 0
		tiltRange = 0, 0
		cameraTransformName = cameraTransform
		rotation = -90, 0, 0
	}
}
