// HullCameraVDS docking camera on the Tantares ports (docking overlay; Alt + camera key
// also controls from the port). Parented to dockingNode: +z out of the port, so
// forward/up 0,0,1 / 0,1,0 look along the docking axis.

@PART[octans_androgynous_docking_port_s0p5_1|octans_androgynous_docking_port_s0p5_2|octans_basic_docking_port_s0p5_1_female|octans_basic_docking_port_s0p5_1_male|octans_docking_port_s0p5_1_female|octans_docking_port_s0p5_1_male|petra_docking_port_s0p5_1_female|petra_docking_port_s0p5_1_male]:NEEDS[HullCameraVDS]:HAS[!MODULE[MuMechModuleHullCamera*]]:FOR[TantaresIVAExpansion]
{
	MODULE
	{
		name = MuMechModuleHullCameraZoom
		cameraName = #LOC_TIE_DockingCamera
		cameraTransformName = dockingNode
		cameraForward = 0, 0, 1
		cameraUp = 0, 1, 0
		cameraPosition = 0, 0, 0
		cameraFoVMax = 60
		cameraFoVMin = 60
		cameraMode = 1
	}
}

// Male ports: the probe sits on the camera axis. When MAS is installed the
// tie_dockcam transform (1 cm past the probe tip, see TantaresIVAs.cfg) exists:
// follow the DockCam there.
@PART[octans_docking_port_s0p5_1_male|octans_basic_docking_port_s0p5_1_male|petra_docking_port_s0p5_1_male]:NEEDS[HullCameraVDS,AvionicsSystems]:HAS[@MODULE[MASCamera]:HAS[#cameraTransformName[tie_dockcam]]]:FOR[TantaresIVAExpansion]
{
	@MODULE[MuMechModuleHullCameraZoom]:HAS[#cameraTransformName[dockingNode]]
	{
		@cameraTransformName = tie_dockcam
	}
}
