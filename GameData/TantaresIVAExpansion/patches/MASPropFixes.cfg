// MAS prop fixes: these nodes point at transforms missing from the ASET models and stop the
// whole prop with an INITIALIZATION ERROR on screen; nothing else in the props changes.
@PROP[MAS_CrewManual_*]:NEEDS[AvionicsSystems]:AFTER[AvionicsSystems]
{
	@MODULE[MASComponent]
	{
		!TEXTURE_SHIFT:HAS[#transform[ManualRing02]] {}
		!TEXTURE_SHIFT:HAS[#transform[ManualRing03]] {}
	}
}

@PROP[MAS_BigBag*]:NEEDS[AvionicsSystems]:AFTER[AvionicsSystems]
{
	@MODULE[MASComponent]
	{
		!TEXTURE_SHIFT:HAS[#transform[BigBagPlate2Obj]] {}
	}
}
